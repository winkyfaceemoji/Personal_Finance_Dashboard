name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # Windows too: the app is used there, and file locking / atomic replace /
    # path handling behave differently from Linux
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"     # matches the Dockerfile
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q -p no:cacheprovider
